name: FlarePort validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flareport-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm test
      - run: npm run build
      - run: npm run validate:cloudflare
