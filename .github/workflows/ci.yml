name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  template-fixtures:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [open-connector, nodewarden]
    defaults:
      run:
        working-directory: templates/${{ matrix.template }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm test
      - name: Fetch and verify the pinned upstream archive
        run: npm run prepare:upstream
      - name: Install and build the pinned upstream
        run: npm run install:upstream && npm run build:upstream
      - name: Validate the Worker bundle without deploying
        run: npm run validate:cloudflare
