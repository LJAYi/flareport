name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  changed-templates:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.templates.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: templates
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          templates=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | sed -nE 's#^(adapters|templates)/([^/]+)/.*#\2#p' \
            | sort -u \
            | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "matrix=$templates" >> "$GITHUB_OUTPUT"

  template-fixtures:
    needs: changed-templates
    if: needs.changed-templates.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.changed-templates.outputs.matrix) }}
    defaults:
      run:
        working-directory: templates/${{ matrix.template }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm test
      - name: Fetch and verify the pinned upstream archive
        run: npm run prepare:upstream
      - name: Install and build the pinned upstream
        run: npm run install:upstream && npm run build:upstream
      - name: Validate the Worker bundle without deploying
        run: npm run validate:cloudflare
