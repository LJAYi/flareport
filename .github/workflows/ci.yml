name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  template-fixtures:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [open-connector, nodewarden]
    defaults:
      run:
        working-directory: templates/${{ matrix.template }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm test
      - name: Fetch and verify the pinned upstream archive
        run: npm run prepare:upstream
      - name: Install and build the pinned upstream
        run: npm run install:upstream && npm run build:upstream
      - name: Validate the Worker bundle without deploying
        run: npm run validate:cloudflare
