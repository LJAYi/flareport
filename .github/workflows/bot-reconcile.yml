name: Reconcile FlarePort Bot

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

permissions: {}

# The Worker owns SCHEDULER_MODE; this mirror only gates the Actions caller.
# Pause the old timer and drain in-flight work before switching modes.
concurrency:
  group: flareport-bot-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      ((github.event_name == 'schedule' && vars.FLAREPORT_BOT_SCHEDULER_MODE == 'github') ||
       (github.event_name == 'workflow_dispatch' &&
        (vars.FLAREPORT_BOT_SCHEDULER_MODE == 'github' || vars.FLAREPORT_BOT_SCHEDULER_MODE == 'manual')))
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: flareport-scheduler
    steps:
      # No checkout, dependencies, App key, management token or Cloudflare token.
      - name: Wait for the Bot reconciliation result
        env:
          FLAREPORT_BOT_URL: ${{ vars.FLAREPORT_BOT_URL }}
          FLAREPORT_SCHEDULER_TOKEN: ${{ secrets.FLAREPORT_SCHEDULER_TOKEN }}
          FLAREPORT_TRIGGER: ${{ github.event_name == 'schedule' && 'github-schedule' || 'manual' }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const origin = new URL(process.env.FLAREPORT_BOT_URL);
          if (origin.protocol !== 'https:' || origin.username || origin.password ||
              origin.pathname !== '/' || origin.search || origin.hash) {
            throw new Error('FLAREPORT_BOT_URL must be an HTTPS origin');
          }
          const token = process.env.FLAREPORT_SCHEDULER_TOKEN;
          if (!token) throw new Error('Missing scheduler token');
          const source = process.env.FLAREPORT_TRIGGER;
          if (source !== 'github-schedule' && source !== 'manual') throw new Error('Invalid scheduler source');
          const response = await fetch(new URL('/api/scheduler/reconcile', origin), {
            method: 'POST', redirect: 'error', signal: AbortSignal.timeout(240_000),
            headers: { authorization: `Bearer ${token}`, 'x-flareport-trigger': source },
          });
          if (response.status !== 200) throw new Error(`Bot reconciliation HTTP ${response.status}`);
          const result = await response.json();
          if (result.ok !== true || result.reconciliationFailures !== 0 || result.dispatchFailures !== 0) {
            throw new Error('Bot reconciliation did not complete successfully');
          }
          console.log('Bot reconciliation completed successfully');
          NODE
